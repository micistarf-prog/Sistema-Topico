<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Tópico Digital</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <div class="fondo">

        <div class="contenedor">

            <div class="titulo">

                <i class="fa-solid fa-staff-snake icono"></i>

                <h1>Sistema de Tópico Digital</h1>

                <p>
                    IESTP Contralmirante Manuel Villar Olivera
                </p>

            </div>

            <h3 class="subtitulo">
                Seleccione su perfil de acceso
            </h3>

            <div class="row mt-4">

                <!-- Administrador -->

                <div class="col-md-6">

                    <div class="tarjeta">

                        <i class="fa-solid fa-user-shield icono-tarjeta"></i>

                        <h2>Administrador</h2>

                        <p>
                            Gestiona pacientes,
                            atenciones,
                            medicamentos,
                            inventario y reportes.
                        </p>

                        <button
                            class="btn btn-primary boton"
                            onclick="irAdministrador()">

                            Ingresar

                        </button>

                    </div>

                </div>

                <!-- Encargado -->

                <div class="col-md-6">

                    <div class="tarjeta">

                        <i class="fa-solid fa-user-nurse icono-tarjeta"></i>

                        <h2>Encargado de Tópico</h2>

                        <p>
                            Registra pacientes,
                            atenciones médicas
                            y primeros auxilios.
                        </p>

                        <button
                            class="btn btn-success boton"
                            onclick="irEncargado()">

                            Ingresar

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
