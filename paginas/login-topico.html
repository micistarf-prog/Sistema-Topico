<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso Encargado de Tópico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dff3f8, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .10);
        }

        .card-header-custom {
            background: linear-gradient(90deg, #1b9eb7, #4bb9d6);
            text-align: center;
            padding: 35px;
            color: white;
        }

        .icono-medico {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, .15);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            margin-bottom: 15px;
        }

        .icono-medico i {
            font-size: 45px;
            color: white;
        }

        .titulo {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .subtitulo {
            font-size: .9rem;
            opacity: .9;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
        }

        .btn-ingresar {
            background: #1b9eb7;
            color: white;
            height: 50px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
        }

        .btn-ingresar:hover {
            background: #16879d;
            color: white;
        }

        .volver {
            text-decoration: none;
            color: #1b9eb7;
            font-weight: 600;
        }

        .volver:hover {
            color: #16879d;
        }
    </style>

</head>

<body>

    <div class="card login-card">

        <div class="card-header-custom">

            <div class="icono-medico">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>

            <div class="titulo">
                Encargado de Tópico
            </div>

            <div class="subtitulo">
                Ingrese sus credenciales para acceder
            </div>

        </div>

        <div class="card-body p-4">

            <form id="formLogin">

                <div class="mb-3">

                    <label class="form-label">
                        Usuario
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input type="text"
                            id="usuario"
                            class="form-control"
                            placeholder="Ingrese usuario"
                            required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password"
                            id="password"
                            class="form-control"
                            placeholder="Ingrese contraseña"
                            required>

                        <button type="button"
                            class="btn btn-outline-secondary"
                            onclick="mostrarPassword()">

                            <i id="iconoOjo" class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>

                <button type="submit"
                    class="btn btn-ingresar w-100">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Ingresar

                </button>

            </form>

            <div class="text-center mt-4">

                <a href="../index.html" class="volver">

                    <i class="bi bi-arrow-left"></i>
                    Volver al inicio

                </a>

            </div>

        </div>

    </div>

    <script>

        function mostrarPassword() {

            const password =
                document.getElementById("password");

            const icono =
                document.getElementById("iconoOjo");

            if (password.type === "password") {

                password.type = "text";

                icono.classList.remove("bi-eye");
                icono.classList.add("bi-eye-slash");

            } else {

                password.type = "password";

                icono.classList.remove("bi-eye-slash");
                icono.classList.add("bi-eye");

            }
        }

        document.getElementById("formLogin")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                let usuario =
                    document.getElementById("usuario").value;

                let password =
                    document.getElementById("password").value;

                if (
                    usuario === "topico" &&
                    password === "123456"
                ) {

                    alert("Bienvenido al sistema");

                    window.location.href =
                        "dashboard-topico.html";

                }
                else {

                    alert(
                        "Usuario o contraseña incorrectos"
                    );

                }

            });

    </script>

</body>

</html>
